app = "ramherd-app"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  # Operator shut the whole project down 2026-10-08 (real E2B/OpenRouter spend, project
  # finished) -- auto_start_machines was waking the machine right back up on any stray
  # request (confirmed real: a plain health-check curl did it), and min_machines_running=1
  # was telling the platform to keep one running regardless. Both off so a stopped machine
  # actually stays stopped. Flip both back (and the RAMHERD_* secrets this same change
  # turned off) to bring it back up for real.
  auto_start_machines = false
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Launchpad RAM records (server/lib/rams.js, opt-in via RAMHERD_DATA_DIR) persist here,
# so they survive a restart/redeploy -- most other state (fee ledger, roster slots,
# sandboxes, funding/payout history) is still in-memory only and still resets.
[[mounts]]
  source = "ramherd_data"
  destination = "/data"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"

[env]
  RAMHERD_DATA_DIR = "/data"
