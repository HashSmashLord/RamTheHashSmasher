app = "ramherd-app"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Launchpad RAM records (server/lib/rams.js, opt-in via RAMHERD_DATA_DIR) persist here,
# so they survive a restart/redeploy -- most other state (fee ledger, roster slots,
# sandboxes, funding/payout history) is still in-memory only and still resets.
[[mounts]]
  source = "ramherd_data"
  destination = "/data"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"

[env]
  RAMHERD_DATA_DIR = "/data"
