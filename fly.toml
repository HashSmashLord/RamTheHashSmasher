app = "ramherd-app"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# No [[mounts]] yet: all state is in memory and resets on every deploy/restart.
# Add a volume here once launchpad / RAM ownership data must survive restarts.

[[vm]]
  size = "performance-1x"
  memory = "2048mb"
